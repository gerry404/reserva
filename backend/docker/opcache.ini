; OPcache tuning for a long-lived container.
;
; The code never changes while a container is running (a deploy builds a new
; image) so revalidation is pointless work on every include.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

; Laravel reads doc comments through reflection (attributes, container hints),
; so stripping them would break resolution, hence save_comments stays on.
