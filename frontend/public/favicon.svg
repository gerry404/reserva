<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nuvo">
  <!--
    Une horloge à peine dite.

    L'arc ouvert est le cadran dont on n'a gardé que la course ; le point plein
    est l'instant retenu, posé dans l'ouverture. L'aiguille, courte, pointe vers
    lui sans le toucher — c'est elle qui fait basculer la lecture de l'anneau
    abstrait vers le rendez-vous, sans dessiner une horloge complète qui rendrait
    la marque banale.

    Les écarts comptent autant que les formes : aiguille jointe au point, on lit
    une épingle ; arc refermé dessus, une masse. Ce fichier est engendré depuis
    les mêmes constantes que scripts/generate-icons.mjs — les deux ne peuvent
    donc pas diverger.
  -->
  <defs>
    <linearGradient id="nuvo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#635BFF"/>
      <stop offset="1" stop-color="#3D1FD6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#nuvo-bg)"/>

  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M50.0 33.3A18.0 18.0 0 1 1 39.0 15.4" stroke-width="6.4"/>
    <path d="M32 32 38.8 27.9" stroke-width="4.6"/>
  </g>

  <circle cx="47.3" cy="22.6" r="5.6" fill="#fff"/>
</svg>
