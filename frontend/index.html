<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA essentials -->
  <meta name="theme-color" content="#14603C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Nuvo" />

  <!-- Apple PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Nuvo" />
  <link rel="apple-touch-icon" href="/icons/apple-touch.png" />

  <!-- La marque est vectorielle : nette à toutes les tailles, et 500 fois plus
       légère que le PNG qu'elle remplace. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

  <!-- SEO & Social -->
  <meta name="description" content="Nuvo : gérez vos réservations sans stress." />
  <meta name="keywords"
    content="réservation, Afrique, commerçant, WhatsApp, salon, booking, gestion, entreprise, réservation en ligne" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Nuvo · Réservations en ligne" />
  <meta property="og:description"
    content="Créez votre page de réservation en 5 minutes. Vos clients réservent 24h/24, vous recevez une notification WhatsApp." />
  <!-- Absolute URLs: WhatsApp and Facebook do not resolve relative paths, so
       the shared preview came out blank, on the very channel Nuvo links are
       shared through. __SITE_URL__ is substituted at build time. -->
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:image" content="__SITE_URL__/icons/icon-512.png" />
  <meta property="og:site_name" content="Nuvo" />
  <meta property="og:locale" content="fr_FR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nuvo · Réservations en ligne" />
  <meta name="twitter:description"
    content="Créez votre page de réservation en 5 minutes. Vos clients réservent 24h/24." />
  <meta name="twitter:image" content="__SITE_URL__/icons/icon-512.png" />

  <title>Nuvo · Réservations en ligne</title>

  <!--
    Les polices sont auto-hébergées (src/assets/fonts/). Elles venaient du CDN
    Google : deux connexions bloquantes vers un tiers avant le premier texte
    affiché, sur un produit dont les utilisateurs sont majoritairement en 3G en
    Afrique de l'Ouest et centrale. Servies avec le bundle, elles arrivent sur
    la connexion déjà ouverte, fonctionnent hors ligne, et laissent retirer
    fonts.googleapis.com et fonts.gstatic.com de la CSP.
  -->
</head>

<body class="bg-gray-50 antialiased">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
